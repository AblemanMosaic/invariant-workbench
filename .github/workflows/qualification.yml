name: Qualification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install qualification dependencies
        run: python -m pip install cryptography jsonschema
      - name: Verify clone bytes
        run: python -I -B ./VERIFY.py --directory .
      - name: Run full qualification
        run: python -I -B ./tools/qualify.py --out "${{ runner.temp }}/iw-qualification"
